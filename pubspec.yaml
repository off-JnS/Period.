name: period
description: "Menstrual cycle tracking that never leaves the device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

# CLAUDE.md section 6 governs this list. Nothing that makes a network request,
# reports a crash, or collects analytics belongs here, and nothing is added
# without asking first.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Locale-aware date and number formatting for the presentation layer. Dates are
  # never formatted by hand: CycleDate.toIso8601() is for storage, not for people.
  intl: ^0.20.3
  # Local database. SQLCipher rather than plain sqlite3: section 1 treats this
  # data as something that can be used against its owner, so it is encrypted at
  # rest from schema v1. Note sqlite3_flutter_libs is deliberately absent --
  # shipping both links two sqlite3 builds and the plain one can win silently,
  # producing an unencrypted database that behaves normally.
  drift: ^2.30.0
  # Encryption comes from the `hooks.user_defines` block at the bottom of this
  # file, NOT from a plugin package. sqlite3 3.x loads its native library
  # through Dart build hooks, and its changelog is explicit that
  # sqlcipher_flutter_libs should be dropped when upgrading. Adding that package
  # back would link a library nothing uses and quietly leave the database
  # unencrypted.
  sqlite3: ^3.5.2
  path_provider: ^2.1.5
  # Holds the database key in the Android Keystore / iOS Keychain. Wrapped
  # behind DatabaseKeyStore so this package stays swappable.
  flutter_secure_storage: ^9.2.4
  # Annotations only; the generator is a dev dependency.
  freezed_annotation: ^3.1.0
  # Charts on the analysis screen. Allowlisted in section 6. Draws only what
  # was logged: no trend line and no projection, because section 8 forbids
  # implying a direction and a line sloping off the right-hand edge is a
  # prediction whatever the axis says. Makes no network request.
  fl_chart: ^1.2.0
  # The optional app lock section 9 asks for. Prompts with the device's own
  # biometric or passcode; this app never stores a PIN of its own, so there is
  # no secret here to hold or leak. Allowlisted in section 6. Makes no network
  # request.
  local_auth: ^3.0.2
  # Hands a finished backup to the system share sheet, so the user chooses
  # where it lands and the app never writes her data anywhere shared on its
  # own. Allowlisted in section 6. Makes no network request.
  share_plus: ^12.0.0
  # Lets her pick a backup file to restore from. The app's own documents
  # directory is not reachable by a person on either platform, so without this
  # an exported backup could never come back. Allowlisted in section 6. Makes
  # no network request.
  file_picker: ^10.3.9
  # State management. Allowlisted in section 6. Wires the database to the UI
  # without threading objects through constructors, and lets tests and goldens
  # swap in an in-memory database.
  flutter_riverpod: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Lets `dart test` run the domain suite on the plain Dart VM with no Flutter
  # binding, which is what CLAUDE.md section 2 requires of the domain layer.
  test: ^1.31.1
  flutter_lints: ^6.0.0
  # Code generation for the models and the database. Dev-only, no runtime, no
  # network. Required by drift and freezed rather than chosen separately.
  build_runner: ^2.10.0
  drift_dev: ^2.30.0
  freezed: ^4.0.1
  # Allowlisted in section 6. Used to fake the secure storage plugin so the
  # key store can be tested without a platform channel.
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb per l10n.yaml. Section 8: no
  # user-facing string is ever hardcoded in a widget.
  generate: true

# Selects an encrypting build of SQLite. Without this the app bundles plain
# SQLite, `PRAGMA key` is silently ignored -- unknown pragmas are a no-op in
# SQLite -- and the database is written in the clear while behaving completely
# normally. Section 1 makes that the worst failure this app can have.
#
# sqlite3mc (SQLite3MultipleCiphers) rather than sqlcipher: it does not link
# OpenSSL, which keeps a third-party crypto library out of a privacy-critical
# app and the binary smaller, and it tracks a more current SQLite than the
# SQLCipher build shipped by package:sqlite3.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
